name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.lock
      - name: Run tests
        # pytest 临时目录移出仓库（run 31952467496 在真实 Linux 环境发现
        # 仓库内 temp + symlink portability 问题）；runner.temp 在 /home/runner/work/_temp
        run: python -m pytest -q --basetemp="$RUNNER_TEMP/my_agent_pytest"
