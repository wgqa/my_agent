<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A quiet, evidence-grounded engineering workspace."
    />
    <title>Engineering Agent</title>
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Conversations">
        <div class="sidebar-top">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">E</div>
            <div class="brand-name">
              <strong>Engineering Agent</strong>
            </div>
          </div>

          <button
            id="new-conversation"
            class="new-chat-button"
            type="button"
            aria-label="Create a new chat"
          >
            <span class="new-chat-plus" aria-hidden="true">✎</span>
            <span>New chat</span>
          </button>

          <div class="sidebar-section-label">Chats</div>
          <div id="conversation-list" class="conversation-list" role="list">
            <div class="list-placeholder">Loading…</div>
          </div>
        </div>

        <div class="sidebar-footer" hidden>
          <span id="api-status" class="api-status" hidden>
            <span class="status-dot__light" aria-hidden="true"></span>
            <span id="api-status-text">API unavailable</span>
          </span>
          <button id="refresh-conversations" class="text-button" type="button">
            Refresh
          </button>
        </div>
      </aside>

      <main class="chat-column" aria-label="Chat">
        <header class="chat-topbar">
          <h1 id="conversation-title">Engineering Agent</h1>
          <div class="chat-topbar-context">
            <span id="run-status" class="run-status" hidden></span>
            <span id="project-name" class="project-name">Project</span>
          </div>
        </header>

        <div id="messages" class="messages" aria-live="polite">
          <div class="empty-chat">
            <div class="empty-chat__mark" aria-hidden="true">↗</div>
            <h2>Ask about this project</h2>
            <p>Explore the repository with evidence-grounded answers.</p>
          </div>
        </div>

        <div id="live-run" class="live-run" hidden>
          <div class="live-run-heading">
            <span id="live-run-label">Analyzing…</span>
            <span class="live-run-note">Live</span>
          </div>
          <ol id="live-activity-list" class="activity-list">
            <li class="section-empty">Waiting for runtime activity…</li>
          </ol>
        </div>

        <form id="composer" class="composer">
          <label class="sr-only" for="message-input">Message</label>
          <textarea
            id="message-input"
            name="message"
            rows="1"
            maxlength="12000"
            placeholder="Ask about this project…"
            autocomplete="off"
            spellcheck="true"
          ></textarea>
          <button
            id="send-message"
            class="send-button"
            type="submit"
            aria-label="Send message"
            title="Send message"
          >
            <span aria-hidden="true">↑</span>
          </button>
        </form>
      </main>

      <aside
        id="evidence-drawer"
        class="evidence-drawer"
        aria-label="Run details"
        aria-hidden="true"
      >
        <div class="drawer-header">
          <nav class="drawer-tabs" aria-label="Run details tabs" role="tablist">
            <button class="drawer-tab is-active" type="button" role="tab" aria-selected="true" data-drawer-tab="sources">
              Sources <span id="drawer-sources-count">0</span>
            </button>
            <button class="drawer-tab" type="button" role="tab" aria-selected="false" data-drawer-tab="activity">
              Activity <span id="drawer-activity-count">0</span>
            </button>
            <button class="drawer-tab" type="button" role="tab" aria-selected="false" data-drawer-tab="run">
              Run
            </button>
          </nav>
          <button id="drawer-close" class="drawer-close" type="button" aria-label="Close details drawer" title="Close">
            ×
          </button>
        </div>
        <div class="drawer-content">
          <section id="drawer-sources" class="drawer-panel" role="tabpanel" aria-label="Sources"></section>
          <section id="drawer-activity" class="drawer-panel" role="tabpanel" aria-label="Activity" hidden></section>
          <section id="drawer-run" class="drawer-panel" role="tabpanel" aria-label="Run" hidden></section>
        </div>
      </aside>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
